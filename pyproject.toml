[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urisolver"
version = "0.2.0.dev0"
description = "Register a URI as a node on a Tiled server."
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
authors = [{ name = "phzwart" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
tiled = ["tiled[client]>=0.2.18,<0.3", "pyyaml>=6"]
server = ["tiled[server]>=0.2.18,<0.3", "pyyaml>=6"]
globus = ["globus-sdk>=3.40", "pyyaml>=6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pyyaml>=6",
    "tiled[all]>=0.2.18,<0.3",
    "numpy",
    "pandas",
    "pyarrow",
    "globus-sdk>=3.40",
]

[project.scripts]
urisolver = "urisolver.cli:main"

[project.entry-points."urisolver.binders"]
file = "urisolver.binders.file:FileBinder"
tiled = "urisolver.binders.tiled:TiledBinder"
globus = "urisolver.binders.globus:GlobusBinder"
zenodo = "urisolver.binders.zenodo:ZenodoBinder"

[tool.hatch.build.targets.sdist]
include = [
    "src/urisolver",
    "DESIGN.md",
    "SCHEMES.md",
    "README.md",
    "LICENSE",
    "tests",
    "examples/site.example.yaml",
]
exclude = ["tools", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/kg/tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff's built-in default is wider than this repository. Keep the historical
# pycodestyle-error and pyflakes set. One-line statements are an existing style.
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]
