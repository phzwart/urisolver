[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urisolver"
version = "0.1.0"
description = "Resolve URI references into usable resources with a universal Tier 0 delivery contract."
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
authors = [{ name = "urisolver contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
tiled = ["tiled>=0.2.16", "pyyaml>=6", "pyarrow>=14"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
urisolver = "urisolver.cli:main"

[project.entry-points."urisolver.resolvers"]
file = "urisolver.resolvers.file:FileResolver"
"com.urisolver.example.tiled" = "urisolver.resolvers.example_tiled:ExampleCatalogResolver"

[project.entry-points."urisolver.namespaces"]
[project.entry-points."urisolver.secrets"]
[project.entry-points."urisolver.codecs"]

[tool.hatch.build.targets.wheel]


[tool.hatch.build.targets.sdist]
include = ["src/urisolver", "DESIGN.md", "README.md", "LICENSE", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
