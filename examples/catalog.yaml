# Local resolution catalog. A scheme names a server. The URI path is the
# object on that server. Another protocol (for example Globus) is another
# scheme in this file.

com.urisolver.example.tiled:
  protocol: tiled
  base_uri: https://tiled-demo.nsls2.bnl.gov
  native: [memory]
  # One manager holds every id. secret_id is the default for this server.
  # secrets maps a path prefix to another id; the longest match wins.
  # examples/images/astronaut -> tiled-default
  # examples/private/scan -> tiled-lab
  # examples/private/raw/frame -> tiled-raw
  # The public demo sets neither, so resolve asks for nothing.
  # secret_id: tiled-default
  # secrets:
  #   examples/private: tiled-lab
  #   examples/private/raw: tiled-raw

# Public CryoET Data Portal origin. The URI path is one object on it.
# A .zarr path is an OME-Zarr multiscale array. An .mrc path is one file.
# No secret: the objects are anonymous HTTPS.
com.urisolver.example.cryoet:
  protocol: cryoet
  base_uri: https://files.cryoetdataportal.cziscience.com
  native: [memory, file]

# Tutorial Collection 1. staging is this machine's Globus Connect Personal
# collection. Replace the placeholder UUID and the accessible prefix.
# Another Globus scheme can reuse the block with `staging: *example-staging`.
com.urisolver.example.globus:
  protocol: globus
  collection: 6c54cade-bde5-45c1-bdea-f4bd71dba2cc
  native: [file]
  secret_id: globus-example
  # secrets:
  #   share/godata/secret: globus-secret
  staging: &example-staging
    collection: 00000000-0000-0000-0000-000000000000
    root: /
    accessible:
      - /CHANGE_ME
