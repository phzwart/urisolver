name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        tiled: ["unpinned"]
        include:
          - python-version: "3.12"
            tiled: "0.2.18"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[dev]"
          if [ "${{ matrix.tiled }}" = "0.2.18" ]; then
            pip install "tiled[all]==0.2.18"
          fi
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
